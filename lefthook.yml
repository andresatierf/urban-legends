pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{js,ts,jsx,tsx}"
      exclude: "convex/_generated/**"
      run: bun --bun oxlint --fix {staged_files}
    oxfmt:
      glob: "*.{js,ts,jsx,tsx}"
      exclude: "convex/_generated/**"
      run: bun --bun oxfmt --write {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{js,ts,jsx,tsx}"
      exclude:
        - "convex/_generated/**"
        - ".sandcastle/**"
      run: bun run typecheck
post-checkout:
  commands:
    install:
      run: bun install
