pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{js,ts,jsx,tsx}"
      exclude: "convex/_generated/**"
      run: bun --bun oxlint {staged_files}
    oxfmt:
      glob: "*.{js,ts,jsx,tsx,json,jsonc}"
      exclude: "convex/_generated/**"
      run: bun --bun oxfmt --write {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{js,ts,jsx,tsx}"
      exclude: "convex/_generated/**"
      run: bun --bun tsc-files --noEmit {staged_files}
post-checkout:
  commands:
    install:
      run: bun install
